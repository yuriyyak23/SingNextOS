name: Sing+ local guarantees

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-guarantees:
    name: SingNextOS local guarantees
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout SingNextOS
        uses: actions/checkout@v4

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SingNextOS.slnx

      - name: Build
        run: dotnet build SingNextOS.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/SingPlus.Tests/SingPlus.Tests.csproj --configuration Release --no-build

      - name: Analyzer tests
        run: dotnet test tests/SingPlus.Tests/SingPlus.Tests.csproj --configuration Release --no-build --filter "Category=Analyzers"

      - name: Generator tests
        run: dotnet test tests/SingPlus.Tests/SingPlus.Tests.csproj --configuration Release --no-build --filter "Category=Generators"

      - name: Negative compilation tests
        run: dotnet test tests/SingPlus.Tests/SingPlus.Tests.csproj --configuration Release --no-build --filter "Category=NegativeCompilation"

      - name: Admission verifier tests
        run: dotnet test tests/SingPlus.Tests/SingPlus.Tests.csproj --configuration Release --no-build --filter "Category=Admission"

      - name: Determinism tests
        run: dotnet test tests/SingPlus.Tests/SingPlus.Tests.csproj --configuration Release --no-build --filter "Category=Determinism"

      - name: Property tests
        run: dotnet test tests/SingPlus.Tests/SingPlus.Tests.csproj --configuration Release --no-build --filter "Category=Property"

  hybridcpu-domain-integration:
    name: HybridCPU neutral domain integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout SingNextOS
        uses: actions/checkout@v4
        with:
          path: SingNextOS

      - name: Checkout pinned HybridCPU exact mapping acquire runtime
        uses: actions/checkout@v4
        with:
          repository: yuriyyak23/HybridCPU-v2
          ref: 4dce496d072b56efae61dfa9d99058eaa782fea3
          path: HybridCPU-v2

      - name: Setup .NET from SingNextOS global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: SingNextOS/global.json

      - name: Restore Sing HybridCPU integration tests
        working-directory: SingNextOS
        run: dotnet restore tests/SingPlus.Platform.HybridCpu.Tests/SingPlus.Platform.HybridCpu.Tests.csproj

      - name: Build Sing HybridCPU provider and integration tests
        working-directory: SingNextOS
        run: dotnet build tests/SingPlus.Platform.HybridCpu.Tests/SingPlus.Platform.HybridCpu.Tests.csproj --configuration Release --no-restore

      - name: Run Sing HybridCPU provider integration tests
        working-directory: SingNextOS
        run: dotnet test tests/SingPlus.Platform.HybridCpu.Tests/SingPlus.Platform.HybridCpu.Tests.csproj --configuration Release --no-build

      - name: Run HybridCPU neutral facade tests
        run: dotnet test HybridCPU-v2/HybridCPU_NeutralRuntime.Tests/HybridCPU_NeutralRuntime.Tests.csproj --configuration Release

# The normal local-guarantees job remains independent of HybridCPU source.
# Phase-4 two-domain MOVE/acquire is verified only by the pinned narrow integration job above.
